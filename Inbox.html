<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #f0f0f0;
    font-family: Arial, sans-serif;
  }
  
  .card {
    width: 300px;
    height: 200px;
    perspective: 1000px;
    cursor: pointer;
  }
  
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }
  
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    font-weight: bold;
  }
  
  .card-front {
    background: #4CAF50;
    color: white;
    font-size: 24px;
  }
  
  .card-back {
    background: white;
    transform: rotateY(180deg);
    font-size: 20px;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  
  .flash {
    animation: flash 0.3s 4;
  }
  
  @keyframes flash {
    0%, 100% { opacity: 1; background: white; color: black; }
    50% { opacity: 1; background: yellow; color: red; transform: scale(1.1); }
  }
  
  .black-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    z-index: 1000;
  }
</style>
</head>
<body>

<div class="card" id="flipCard">
  <div class="card-inner">
    <div class="card-front">Tap to flip</div>
    <div class="card-back" id="cardBack">
      Congratulations 🎉 Your are doing your 1st mistake.
    </div>
  </div>
</div>

<div class="black-screen" id="blackScreen">
  Congratulations 🎉 Your are doing your 1st mistake.
</div>

<script>
  const card = document.getElementById('flipCard');
  const cardBack = document.getElementById('cardBack');
  const blackScreen = document.getElementById('blackScreen');
  
  card.addEventListener('click', () => {
    if (!card.classList.contains('flipped')) {
      card.classList.add('flipped');
      
      // Start flashing after flip completes
      setTimeout(() => {
        cardBack.classList.add('flash');
        
        // Show black screen after flashing ends
        setTimeout(() => {
          blackScreen.style.display = 'flex';
        }, 1200); // 0.3s * 4 flashes = 1.2s
      }, 600); // wait for flip animation
    }
  });
</script>

</body>
</html>
